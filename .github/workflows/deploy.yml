name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # shortcut: assets land before the code pull, so a failed release leaves new assets with old code; fine while builds are additive
      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }}" \
            public/build/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/"

      - name: Pull and release on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -se" <<'EOF'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"

          php artisan down --retry=30 || true
          trap 'php artisan up' EXIT

          git pull --ff-only origin main
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

          php artisan migrate --force
          php artisan storage:link --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          EOF
